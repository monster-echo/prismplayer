# 发布流程：本地只跑测试，发版一律走 tag
#
#   1. 改 AppScope/app.json5 的 versionName / versionCode
#   2. git commit -m "release: x.y.z"
#   3. git tag -a vx.y.z -m "PrismPlayer x.y.z" && git push origin main --tags
#
# tag 推上去后本 workflow 自动：校验版本号 → 构建 release HAP → 签名 → 建 GitHub Release。
# 需要一台装了 DevEco Studio 的 macOS self-hosted runner（当前：prism-mac-studio）。
# 手动触发（workflow_dispatch）默认 publish=false，只校验构建与签名。
name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发只做「构建 + 签名」校验，默认不建 Release
  workflow_dispatch:
    inputs:
      publish:
        description: '是否创建 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # DevEco SDK 不在 GitHub 托管镜像里，必须用自建 macOS runner（prism-mac-studio）
    runs-on: [self-hosted, macOS]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve SDK and toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_HOME="${DEVECO_SDK_HOME:-/Applications/DevEco-Studio.app/Contents/sdk}"
          HVIGOR="${HVIGORW:-/Applications/DevEco-Studio.app/Contents/tools/hvigor/bin/hvigorw}"
          test -d "$SDK_HOME" || { echo "找不到 HarmonyOS SDK：$SDK_HOME，请在 runner 上设置 DEVECO_SDK_HOME"; exit 1; }
          test -x "$HVIGOR" || { echo "找不到 hvigorw：$HVIGOR"; exit 1; }
          echo "DEVECO_SDK_HOME=$SDK_HOME" >> "$GITHUB_ENV"
          echo "HVIGORW=$HVIGOR" >> "$GITHUB_ENV"
          echo "HAP_SIGN_JAR=$SDK_HOME/default/openharmony/toolchains/lib/hap-sign-tool.jar" >> "$GITHUB_ENV"

      - name: Verify tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/.*"versionName": *"\([^"]*\)".*/\1/p' AppScope/app.json5 | head -1)
          if [ "${{ github.event_name }}" = "push" ]; then TAG_VERSION="${GITHUB_REF_NAME#v}"; else TAG_VERSION="$APP_VERSION"; fi
          APP_CODE=$(sed -n 's/.*"versionCode": *\([0-9]*\).*/\1/p' AppScope/app.json5 | head -1)
          echo "tag=$TAG_VERSION app=$APP_VERSION code=$APP_CODE"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 app.json5 的 versionName $APP_VERSION 不一致，先改版本号再打 tag"
            exit 1
          fi

      - name: Build release HAP
        shell: bash
        run: |
          set -euo pipefail
          "$HVIGORW" --mode module -p module=entry@default -p product=default -p buildMode=release --no-daemon assembleHap
          HAP=$(ls entry/build/default/outputs/default/*-unsigned.hap | head -1)
          echo "HAP_UNSIGNED=$HAP" >> "$GITHUB_ENV"

      - name: Sign HAP
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.HARMONY_KEYSTORE_B64 }}
          CERT_B64: ${{ secrets.HARMONY_CERT_B64 }}
          PROFILE_B64: ${{ secrets.HARMONY_PROFILE_B64 }}
          KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.HARMONY_KEY_PASSWORD }}
          STORE_PWD: ${{ secrets.HARMONY_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${CERT_B64:-}" ] || [ -z "${PROFILE_B64:-}" ]; then
            echo "::error::缺少签名 secrets（HARMONY_KEYSTORE_B64 / HARMONY_CERT_B64 / HARMONY_PROFILE_B64）"
            exit 1
          fi
          OUT="$RUNNER_TEMP/prismplayer-${GITHUB_REF_NAME#v}-release.hap"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/release.cer"
          echo "$PROFILE_B64" | base64 -d > "$RUNNER_TEMP/release.p7b"
          java -jar "$HAP_SIGN_JAR" sign-app \
            -keyAlias "${KEY_ALIAS:-cortex-release}" -signAlg SHA256withECDSA -mode localSign \
            -appCertFile "$RUNNER_TEMP/release.cer" \
            -profileFile "$RUNNER_TEMP/release.p7b" \
            -inFile "$HAP_UNSIGNED" \
            -keystoreFile "$RUNNER_TEMP/release.p12" \
            -outFile "$OUT" \
            -keyPwd "$KEY_PWD" -keystorePwd "$STORE_PWD"
          test -f "$OUT" || { echo "::error::签名产物缺失"; exit 1; }
          echo "HAP_SIGNED=$OUT" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="v${VERSION}"
          gh release create "$TAG" \
            "$HAP_SIGNED#prismplayer-${VERSION}-release.hap" \
            --title "棱镜影院 ${VERSION}" \
            --generate-notes

      - name: Cleanup signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/release.cer" "$RUNNER_TEMP/release.p7b"
